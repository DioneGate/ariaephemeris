name: RM-001-008 One-shot pinned source formatter and synthetic event tests retry

on:
  push:
    branches:
      - feature/rm-001-008-wp5-5-independent-event-timing-20261119
    paths:
      - '.github/workflows/wp55-format-once.yml'

permissions:
  contents: write

jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned scientific test dependencies
        run: |
          python -m pip install -r requirements/development.lock
          python -m pip install --no-deps -e .
      - name: Apply project-pinned Ruff formatting to new WP5.5 code
        run: |
          ruff check --fix tools/datasets/wp55_event_math.py tools/datasets/acquire_wp55_events.py tools/datasets/verify_wp55_events.py tools/datasets/compare_wp55_events.py tests/unit/test_wp55_independent_event_timing.py
          ruff format tools/datasets/wp55_event_math.py tools/datasets/acquire_wp55_events.py tools/datasets/verify_wp55_events.py tools/datasets/compare_wp55_events.py tests/unit/test_wp55_independent_event_timing.py
          ruff check tools/datasets/wp55_event_math.py tools/datasets/acquire_wp55_events.py tools/datasets/verify_wp55_events.py tools/datasets/compare_wp55_events.py tests/unit/test_wp55_independent_event_timing.py
      - name: Prove independent JPL root mathematics and chart-event test harness
        run: pytest -q tests/unit/test_wp55_independent_event_timing.py
      - name: Freeze test-proven format and remove formatter
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/wp55-format-once.yml
          git add tools/datasets/wp55_event_math.py tools/datasets/acquire_wp55_events.py tools/datasets/verify_wp55_events.py tools/datasets/compare_wp55_events.py tests/unit/test_wp55_independent_event_timing.py
          git commit -m "style(RM-001/008): pinned Ruff and independent event timing synthetic tests"
          git push origin HEAD:feature/rm-001-008-wp5-5-independent-event-timing-20261119
