name: Temporary WP5.2 pinned formatter (self-removing)
on:
  push:
    branches:
      - feature/rm-001-005-horizons-numerical-comparison-20261119
    paths:
      - '.github/workflows/wp5-2-format-once.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run project-pinned formatter and remove this one-shot workflow
        run: |
          set -euo pipefail
          if [ ! -f .github/workflows/wp5-2-format-once.yml ]; then
            echo "Formatter workflow was already removed"
            exit 0
          fi
          python -m pip install ruff==0.17.0
          ruff check --fix tools/datasets/compare_horizons_fixtures.py tests/unit/test_horizons_numerical_comparison.py
          ruff format tools/datasets/compare_horizons_fixtures.py tests/unit/test_horizons_numerical_comparison.py
          ruff check tools/datasets/compare_horizons_fixtures.py tests/unit/test_horizons_numerical_comparison.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wp5-2-format-once.yml
          git add tools/datasets/compare_horizons_fixtures.py tests/unit/test_horizons_numerical_comparison.py
          git commit -m 'style(RM-001/005): apply pinned Ruff formatting; remove temporary formatting workflow'
          git push origin HEAD:feature/rm-001-005-horizons-numerical-comparison-20261119
