name: RM-001-004 Acquire independent JPL Horizons fixtures

# One-shot, manually authorised refresh only; routine CI never calls live Horizons.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  acquire-reference:
    if: github.ref == 'refs/heads/feature/rm-001-004-independent-horizons-fixtures-20261119'
    runs-on: [self-hosted, linux, x64, ci-workload]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire Horizons public API references serially
        run: |
          set -euo pipefail
          python tools/datasets/acquire_horizons_fixtures.py --output-dir data/fixtures/horizons
      - name: Validate all source hashes, target IDs, epochs and modes offline
        run: |
          python tools/datasets/verify_horizons_fixtures.py --directory data/fixtures/horizons
      - name: Commit immutable third-party response evidence on WP5.1 branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fixtures/horizons
          if git diff --cached --quiet; then
            echo "Existing reference fixtures unchanged"
          else
            git commit -m "data(RM-001/004): capture 300 original Horizons reference fixtures and source provenance"
            git push origin HEAD:feature/rm-001-004-independent-horizons-fixtures-20261119
          fi
      - name: Retain offline fixture data as Actions evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm-001-004-horizons-acquisition
          path: data/fixtures/horizons/
          if-no-files-found: warn
          retention-days: 30
