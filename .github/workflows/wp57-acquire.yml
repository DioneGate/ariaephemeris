name: RM-001-010 explicit source capture and uncertainty qualification
on:
  push:
    branches: [feature/rm-001-010-model-uncertainty]
    paths: ['data/fixtures/horizons/wp57-uncertainty/acquisition-request.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wp57-explicit-acquisition
  cancel-in-progress: false
jobs:
  source-and-uncertainty:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/development.lock
      - run: |
          python -m pip install -r requirements/development.lock
          python -m pip install --no-deps -e .
      - name: Verify pre-acquisition scientific scope and tests
        run: |
          git fetch origin df381bdf46d95b13c2259e4af8f9b37bc27b87dd
          git show df381bdf46d95b13c2259e4af8f9b37bc27b87dd:data/fixtures/horizons/wp57-uncertainty/specification.json > /tmp/wp57-spec.json
          cmp /tmp/wp57-spec.json data/fixtures/horizons/wp57-uncertainty/specification.json
          ruff check .
          ruff format --check .
          pytest -q tests/unit/test_wp57_uncertainty.py tests/unit/test_horizons_source_attribution.py
      - name: Explicit serial JPL component and source-only station-ray capture
        run: |
          if [ ! -f data/fixtures/horizons/wp57-uncertainty/source.json ]; then
            python tools/datasets/wp57_source.py acquire
          fi
          python tools/datasets/wp57_source.py verify
      - uses: actions/cache@v4
        with:
          path: |
            .artifacts/de442s.bsp
            .artifacts/planet-centres
          key: wp57-six-original-spks-v1
      - name: Acquire and verify original pinned source kernels
        run: |
          set -euo pipefail
          ariaephemeris install-data .artifacts
          mkdir -p .artifacts/planet-centres
          python - <<'PY' > .artifacts/centres.tsv
          from ariaephemeris.datasets import centres_manifest
          for b,r in centres_manifest()['sources'].items():
              print(b,r['filename'],r['source_url'],sep='\t')
          PY
          while IFS=$'\t' read -r body filename url; do
            if [ ! -f ".artifacts/planet-centres/$filename" ]; then
              curl --fail --location --show-error --silent --retry 4 --retry-delay 5 \
                --connect-timeout 30 --max-time 1800 "$url" -o ".artifacts/planet-centres/$filename"
            fi
          done < .artifacts/centres.tsv
          python - <<'PY'
          from pathlib import Path
          from ariaephemeris.datasets import centres_manifest,verify_centre_sources
          assert len(verify_centre_sources({b:Path('.artifacts/planet-centres')/r['filename'] for b,r in centres_manifest()['sources'].items()}))==6
          PY
      - name: Require unchanged legacy Jupiter and Pluto numerical attribution
        run: |
          python tools/datasets/attribute_jpl_source_models.py --base .artifacts/de442s.bsp \
            --centres-dir .artifacts/planet-centres --output .artifacts/wp53-replay.json
          cmp .artifacts/wp53-replay.json docs/validation/wp5-3-jpl-source-attribution.json
      - name: Quantify four remaining models and all independent station refinements
        run: |
          python tools/datasets/qualify_wp57_uncertainty.py --base .artifacts/de442s.bsp --centres-dir .artifacts/planet-centres
      - name: Preserve source and diagnostics even if a scientific gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp57-original-jpl-source-and-uncertainty
          path: |
            data/fixtures/horizons/wp57-uncertainty/
            docs/validation/wp57-model-uncertainty.json
          retention-days: 60
      - name: Freeze original source and actual numerical results on review branch
        if: always()
        run: |
          set -euo pipefail
          if [ -f data/fixtures/horizons/wp57-uncertainty/source.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/fixtures/horizons/wp57-uncertainty
            if [ -f docs/validation/wp57-model-uncertainty.json ]; then
              git add docs/validation/wp57-model-uncertainty.json
            fi
            if ! git diff --cached --quiet; then
              git commit -m 'data(RM-001/010): freeze original four-model components and station uncertainty evidence'
              git push origin HEAD:feature/rm-001-010-model-uncertainty
            fi
          fi
