name: RM-001-008 WP5.5 capture independent JPL event roots (one-shot)

on:
  push:
    branches:
      - feature/rm-001-008-wp5-5-independent-event-timing-20261119
    paths:
      - '.github/workflows/wp55-source-acquisition-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  real-source:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/development.lock
      - name: Install exact pinned engine and numerical dependencies
        run: |
          python -m pip install -r requirements/development.lock
          python -m pip install --no-deps -e .
      - name: Verify independent-reference maths and original WP5.4 source
        run: |
          set -euo pipefail
          pytest -q tests/unit/test_wp55_independent_event_timing.py
          python tools/datasets/verify_wp54_tropical.py --root data/fixtures/horizons/wp54-tropical --wp51 data/fixtures/horizons
          ruff check tools/datasets/wp55_event_math.py tools/datasets/acquire_wp55_events.py tools/datasets/verify_wp55_events.py tools/datasets/compare_wp55_events.py tests/unit/test_wp55_independent_event_timing.py
          ruff format --check tools/datasets/wp55_event_math.py tools/datasets/acquire_wp55_events.py tools/datasets/verify_wp55_events.py tools/datasets/compare_wp55_events.py tests/unit/test_wp55_independent_event_timing.py
      - name: Download JPL DE442s and validate original source SHA
        run: ariaephemeris install-data .artifacts
      - name: Acquire six original supplementary planet-centre SPKs and validate SHA-256
        run: |
          set -euo pipefail
          mkdir -p .artifacts/planet-centres
          python - <<'PY' > .artifacts/centres.tsv
          from ariaephemeris.datasets import centres_manifest
          for body, r in centres_manifest()["sources"].items():
              print(body, r["filename"], r["source_url"], sep="\t")
          PY
          while IFS=$'\t' read -r body filename url; do
            echo "Fetching pinned JPL physical-centre source: $body"
            curl --fail --location --show-error --silent --retry 5 --retry-delay 5 \
              --connect-timeout 30 --max-time 1800 "$url" \
              -o ".artifacts/planet-centres/$filename"
          done < .artifacts/centres.tsv
          python - <<'PY'
          from pathlib import Path
          from ariaephemeris.datasets import centres_manifest, verify_centre_sources
          r=centres_manifest()["sources"]
          assert len(verify_centre_sources({
              b: Path(".artifacts/planet-centres") / v["filename"] for b, v in r.items()
          })) == 6
          print("Six unmodified planet-centre SPK source SHA-256 verified")
          PY
      - name: Select 22 candidate event windows and acquire external JPL apparent directions
        run: |
          set -euo pipefail
          if [ -f data/fixtures/horizons/wp55-events/wp55-horizons-event-roots-v1.json ]; then
            echo "Already frozen: refuse Horizons refresh"
          else
            python tools/datasets/acquire_wp55_events.py \
              --base .artifacts/de442s.bsp \
              --centres-dir .artifacts/planet-centres \
              --wp54 data/fixtures/horizons/wp54-tropical \
              --output data/fixtures/horizons/wp55-events
          fi
      - name: Independently verify every original source response and exact JPL root grid
        run: |
          python tools/datasets/verify_wp55_events.py \
            --source data/fixtures/horizons/wp55-events \
            --wp54 data/fixtures/horizons/wp54-tropical
      - name: Independently interpolate Horizons event roots and compare Aria event-search results
        run: |
          python tools/datasets/compare_wp55_events.py \
            --source data/fixtures/horizons/wp55-events \
            --wp54 data/fixtures/horizons/wp54-tropical \
            --base .artifacts/de442s.bsp \
            --centres-dir .artifacts/planet-centres \
            --output docs/validation/wp55-independent-event-roots.json
      - name: Verify complete results without false scientific or timing certification
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          f=json.loads(Path("data/fixtures/horizons/wp55-events/wp55-horizons-event-roots-v1.json").read_text())
          r=json.loads(Path("docs/validation/wp55-independent-event-roots.json").read_text())
          assert f["case_count"]==r["event_case_count"]==22
          assert set(r["per_kind"])=={"station","ingress","conjunction","opposition"}
          assert {k:r["per_kind"][k]["sample_count"] for k in r["per_kind"]}=={
              "station":6,"ingress":6,"conjunction":5,"opposition":5
          }
          assert all(math.isfinite(q["jpl_reference"]["jd_tt"]) for q in r["rows"])
          assert all(q["jpl_reference"]["sampled_reference_root_unique_in_grid"] for q in r["rows"])
          assert not r["commercial_event_timing_qualified"]
          assert not r["absolute_astronomical_accuracy_certified"]
          assert not r["reference_interpolation_error_bound_established"]
          print("22 original-source JPL roots and signed comparisons, with explicit science limits")
          PY
      - name: Freeze original source and measured report; retire one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/wp55-source-acquisition-once.yml
          git add data/fixtures/horizons/wp55-events docs/validation/wp55-independent-event-roots.json
          git commit -m 'data(RM-001/008): freeze independent Horizons event timing source and 22 measured roots'
          git push origin HEAD:feature/rm-001-008-wp5-5-independent-event-timing-20261119
      - name: Retain JPL original source fixture and event qualification in workflow artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wp55-original-jpl-event-timing-source-and-comparison
          path: |
            data/fixtures/horizons/wp55-events/
            docs/validation/wp55-independent-event-roots.json
          if-no-files-found: warn
          retention-days: 60
