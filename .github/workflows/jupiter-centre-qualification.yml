name: RM-001-002 Jupiter physical-centre source qualification

on:
  push:
    branches:
      - feature/rm-001-002-centre-source-feasibility-20261118
    paths:
      - '.github/workflows/jupiter-centre-qualification.yml'
      - 'tools/datasets/audit_planet_centres.py'
      - 'tools/datasets/qualify_jupiter_centre.py'
      - 'tests/unit/test_planet_centre_audit.py'
      - 'docs/roadmaps/001-engine-development/jupiter-source-manifest.json'
  pull_request:
    paths:
      - '.github/workflows/jupiter-centre-qualification.yml'
      - 'tools/datasets/audit_planet_centres.py'
      - 'tools/datasets/qualify_jupiter_centre.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jupiter-source-and-cspice:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/development.lock
      - name: Install pinned numerical and independent evaluator dependencies
        run: |
          python -m pip install -r requirements/development.lock
          python -m pip install --no-deps -e .
      - name: Install and verify original Aria DE442s source
        run: ariaephemeris install-data .artifacts
      - name: Fetch official JUP349 and validate independently pinned checksums
        run: |
          set -euo pipefail
          mkdir -p .artifacts/planet-centres
          curl --fail --location --show-error --silent \
            --retry 4 --retry-delay 4 --connect-timeout 25 --max-time 480 \
            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/satellites/jup349.bsp \
            -o .artifacts/planet-centres/jup349.bsp
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          m = json.loads(Path("docs/roadmaps/001-engine-development/jupiter-source-manifest.json").read_text())
          p = Path(".artifacts/planet-centres/jup349.bsp")
          for algo, expected in (("md5", m["published_md5"]), ("sha256", m["observed_sha256_pinned"])):
              d = hashlib.new(algo)
              with p.open("rb") as f:
                  for block in iter(lambda: f.read(1024 * 1024), b""):
                      d.update(block)
              if d.hexdigest() != expected:
                  raise SystemExit(f"JUP349 {algo} mismatch")
          print(f"JUP349 source verified: {p.stat().st_size} bytes, SHA256 {m['observed_sha256_pinned']}")
          PY
      - name: Run pinned SPK segment coverage and DE442s-composition audit
        run: |
          set -euo pipefail
          source_sha=$(python -c 'import json; print(json.load(open("docs/roadmaps/001-engine-development/jupiter-source-manifest.json"))["observed_sha256_pinned"])')
          python tools/datasets/audit_planet_centres.py \
            --kernel jupiter=.artifacts/planet-centres/jup349.bsp \
            --expected-sha256 "jupiter=$source_sha" \
            --base .artifacts/de442s.bsp --sample-jd-tdb 2451545.0 \
            --output .artifacts/jupiter-segment-audit.json
          python -c 'import json; r=json.load(open(".artifacts/jupiter-segment-audit.json")); j=r["source_checks"]["jupiter"]; assert r["coverage_pass"] and r["source_identity_pinned"] and j["reader_and_coverage_pass"] and "sample" in j'
      - name: Compare physical centres with independently evaluated CSPICE
        run: |
          source_sha=$(python -c 'import json; print(json.load(open("docs/roadmaps/001-engine-development/jupiter-source-manifest.json"))["observed_sha256_pinned"])')
          python tools/datasets/qualify_jupiter_centre.py \
            --base .artifacts/de442s.bsp \
            --jupiter .artifacts/planet-centres/jup349.bsp \
            --expected-sha256 "$source_sha" \
            --output .artifacts/jupiter-cspice-comparison.json
      - name: Validate qualification output
        run: |
          python -c 'import json; r=json.load(open(".artifacts/jupiter-cspice-comparison.json")); assert r["evaluator_agreement_pass"]; assert r["source"]["satellite_md5_checked"]==r["source"]["satellite_published_md5"]; assert r["source"]["satellite_sha256_pinned_independently"]; print("JUP349 pinned-source and evaluator qualification passed")'
      - name: Upload evidence (never upload production SPK binaries)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rm-001-002-jupiter-qualification-evidence
          path: |
            .artifacts/jupiter-segment-audit.json
            .artifacts/jupiter-cspice-comparison.json
          if-no-files-found: warn
          retention-days: 30
